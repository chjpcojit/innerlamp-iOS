<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ tap }}" style="display:flex;align-items:center;gap:14px;border-radius:18px;padding:13px 16px;transition:background .16s ease,border-color .16s ease,transform .12s ease;opacity: {{ opacity }};cursor: {{ cursor }};background: {{ cardBg }};border:1px solid {{ cardBd }}" style-hover="{{ hoverStyle }}" style-active="{{ activeStyle }}">
  <div style="width:44px;height:44px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;background: {{ iconBg }}">
    <div style="width:15px;height:15px;border-radius: {{ glyphRadius }};background: {{ glyphFill }};border: {{ glyphBorder }};box-sizing:border-box"></div>
  </div>
  <div style="flex:1;min-width:0">
    <div style="font:500 14px 'Be Vietnam Pro',sans-serif;color: {{ titleColor }}">{{ title }}</div>
    <div style="font:400 11.5px 'Be Vietnam Pro',sans-serif;margin-top:2px;color: {{ subColor }}">{{ sub }}</div>
  </div>
  <div style="font:500 11.5px 'Be Vietnam Pro',sans-serif;white-space:nowrap;color: {{ trailColor }}">{{ trailing }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:362,&quot;height&quot;:72},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Thiền hơi thở buổi sáng&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12 phút · Thầy Minh Đạo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;trailing&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;selected&quot;,&quot;disabled&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;gold&quot;,&quot;green&quot;,&quot;rose&quot;,&quot;ink&quot;],&quot;default&quot;:&quot;gold&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;glyph&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;leaf&quot;,&quot;book&quot;,&quot;circle&quot;,&quot;dot&quot;],&quot;default&quot;:&quot;leaf&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onTap&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, dark = !!p.dark;
    const tones = {
      gold: '#B8862F', green: '#6E8F7A', rose: '#C2857F', ink: 'var(--il-link)',
    };
    const tints = {
      gold: 'rgba(184,134,47,.16)', green: 'rgba(110,143,122,.18)',
      rose: 'rgba(194,133,127,.18)', ink: 'rgba(138,90,24,.14)',
    };
    const tone = tones[p.tone] || tones.gold;
    const glyph = p.glyph || 'leaf';
    const shapes = {
      leaf: { r: '50% 0 50% 50%', fill: tone, bd: 'none' },
      book: { r: '2px', fill: 'transparent', bd: '1.5px solid ' + tone },
      circle: { r: '50%', fill: 'transparent', bd: '1.5px solid ' + tone },
      dot: { r: '50%', fill: tone, bd: 'none' },
    };
    const g = shapes[glyph] || shapes.leaf;
    const state = p.state || 'default';
    const sel = state === 'selected' || !!p.selected;
    const off = state === 'disabled';
    return {
      opacity: off ? '.5' : '1',
      hoverStyle: off ? {} : { background: dark ? '#25211C' : 'var(--il-rowhover)', borderColor: dark ? 'rgba(242,235,221,.16)' : 'var(--il-ink-16)' },
      activeStyle: off ? {} : { transform: 'scale(.99)' },
      title: p.title || 'Tiêu đề', sub: p.sub || '', trailing: p.trailing || '',
      cardBg: sel ? (dark ? '#2A241C' : 'rgba(184,134,47,.10)') : dark ? '#1E1B17' : 'var(--il-card)',
      cardBd: sel ? 'rgba(184,134,47,.55)' : dark ? 'rgba(242,235,221,.08)' : 'var(--il-ink-08)',
      titleColor: dark ? '#F2EBDD' : 'var(--il-ink)',
      subColor: dark ? 'rgba(242,235,221,.42)' : 'var(--il-ink-5)',
      trailColor: dark ? 'rgba(242,235,221,.35)' : 'var(--il-ink-42)',
      iconBg: tints[p.tone] || tints.gold,
      glyphRadius: g.r, glyphFill: g.fill, glyphBorder: g.bd,
      cursor: off ? 'default' : p.onTap ? 'pointer' : 'default',
      tap: off ? undefined : p.onTap,
    };
  }
}
</script>
</body>
</html>
