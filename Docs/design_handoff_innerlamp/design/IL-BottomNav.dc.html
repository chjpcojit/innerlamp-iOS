<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ rootRef }}" style="margin:0 -20px;overflow:hidden;transition:height .32s cubic-bezier(.22,.61,.36,1);height: {{ boxH }}">
<div style="padding:10px 22px 30px;display:flex;align-items:flex-end;justify-content:space-between;will-change:transform;transition:transform .34s cubic-bezier(.22,.61,.36,1);background: {{ fade }};transform: {{ shift }}">
  <div onClick="{{ hHome }}" style="text-align:center;flex:1;cursor:pointer"><div style="width:18px;height:18px;margin:0 auto 5px;border-radius:5px;border:1.6px solid {{ c0 }}"></div><div style="font:500 9.5px 'Be Vietnam Pro',sans-serif;color: {{ c0 }}">Trang chủ</div></div>
  <div onClick="{{ hLib }}" style="text-align:center;flex:1;cursor:pointer"><div style="width:16px;height:18px;margin:0 auto 5px;border-radius:2px;border:1.6px solid {{ c1 }}"></div><div style="font:500 9.5px 'Be Vietnam Pro',sans-serif;color: {{ c1 }}">Thư viện</div></div>
  <div onClick="{{ hLamp }}" style="text-align:center;flex:1;cursor:pointer"><div style="width:48px;height:48px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background: {{ lampBg }};box-shadow: {{ lampShadow }}"><div style="width:14px;height:20px;border-radius:50% 50% 45% 45%/62% 62% 38% 38%;background: {{ lampFlame }}"></div></div></div>
  <div onClick="{{ hSangha }}" style="text-align:center;flex:1;cursor:pointer"><div style="width:18px;height:18px;margin:0 auto 5px;border-radius:50%;border:1.6px solid {{ c2 }}"></div><div style="font:500 9.5px 'Be Vietnam Pro',sans-serif;color: {{ c2 }}">Đạo tràng</div></div>
  <div onClick="{{ hMe }}" style="text-align:center;flex:1;cursor:pointer"><div style="width:18px;height:18px;margin:0 auto 5px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:1.6px solid {{ c3 }}"></div><div style="font:500 9.5px 'Be Vietnam Pro',sans-serif;color: {{ c3 }}">Tôi</div></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:110},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;lib&quot;,&quot;sangha&quot;,&quot;me&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;hidden&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onNav&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(key: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  _ref = React.createRef();

  renderVals() {
    const dark = !!this.props.dark;
    const active = this.props.active || 'home';
    const on = dark ? '#D9963C' : 'var(--il-ink)';
    const off = dark ? 'rgba(242,235,221,.4)' : 'var(--il-ink-4)';
    const go = k => () => this.props.onNav && this.props.onNav(k);
    const c = k => (active === k ? on : off);
    return {
      rootRef: this._ref,
      shift: this.props.hidden ? 'translateY(calc(100% + 12px))' : 'translateY(0)',
      boxH: this.props.hidden ? '0px' : '88px',
      fade: dark
        ? 'linear-gradient(180deg,rgba(20,18,15,0),#14120F 34%)'
        : 'linear-gradient(180deg,transparent,var(--il-canvas) 32%)',
      c0: c('home'), c1: c('lib'), c2: c('sangha'), c3: c('me'),
      lampBg: dark ? '#D9963C' : 'var(--il-ink)',
      lampFlame: dark ? '#1A1611' : 'linear-gradient(180deg,#F3C673,#D9963C)',
      lampShadow: dark ? '0 0 28px rgba(217,150,60,.45)' : '0 8px 20px var(--il-ink-28)',
      hHome: go('home'), hLib: go('lib'), hSangha: go('sangha'), hMe: go('me'), hLamp: go('lamp'),
    };
  }
}
</script>
</body>
</html>
