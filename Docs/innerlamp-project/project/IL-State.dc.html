<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 18px">
  <div style="width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;background: {{ tint }};border:1px solid {{ ring }}">
    <div style="width:26px;height:26px;box-sizing:border-box;border-radius: {{ glyphRadius }};background: {{ glyphFill }};border: {{ glyphBorder }}"></div>
  </div>
  <div style="font:500 28px/1.25 'Cormorant Garamond',serif;font-variant-numeric:lining-nums;margin-top:22px;color: {{ titleColor }}">{{ title }}</div>
  <div style="font:400 14px/1.6 'Be Vietnam Pro',sans-serif;font-variant-numeric:lining-nums;margin-top:10px;max-width:280px;text-wrap:pretty;color: {{ bodyColor }}">{{ body }}</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:280},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;empty&quot;,&quot;error&quot;,&quot;offline&quot;,&quot;done&quot;],&quot;default&quot;:&quot;empty&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Chưa có gì ở đây&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;body&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Khi bạn bắt đầu thời khóa, mọi ghi nhận sẽ hiện ở đây.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, dark = !!p.dark;
    const kinds = {
      empty: { c: '#B8862F', r: '50%', fill: 'transparent' },
      error: { c: '#C2857F', r: '2px', fill: 'transparent' },
      offline: { c: 'var(--il-mid2)', r: '50% 0 50% 50%', fill: 'transparent' },
      done: { c: '#6E8F7A', r: '50%', fill: '#6E8F7A' },
    };
    const k = kinds[p.kind] || kinds.empty;
    const rgb = { '#B8862F': '184,134,47', '#C2857F': '194,133,127', 'var(--il-mid2)': '106,101,92', '#6E8F7A': '110,143,122' }[k.c];
    return {
      title: p.title || 'Chưa có gì ở đây',
      body: p.body || '',
      tint: 'rgba(' + rgb + ',' + (dark ? '.14' : '.12') + ')',
      ring: 'rgba(' + rgb + ',.3)',
      glyphRadius: k.r,
      glyphFill: k.fill,
      glyphBorder: '1.6px solid ' + k.c,
      titleColor: dark ? '#F5EEE0' : 'var(--il-ink)',
      bodyColor: dark ? 'rgba(242,235,221,.55)' : 'var(--il-ink-55)',
    };
  }
}

</script>
</body>
</html>
