<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width: {{ px }};height: {{ px }};border-radius: {{ rad }};background: {{ bg }};color: {{ fg }};flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden">
  <svg viewBox="0 0 44 44" width="100%" height="100%" fill="currentColor" style="display:block">
    <sc-if value="{{ isBook }}" hint-placeholder-val="{{ true }}">
      <g transform="rotate(-8 21 31)"><rect x="10" y="13" width="11" height="18" rx="2"></rect></g>
      <g transform="rotate(8 23 31)"><rect x="23" y="13" width="11" height="18" rx="2"></rect></g>
    </sc-if>
    <sc-if value="{{ isTalk }}">
      <rect x="11" y="17" width="3.6" height="10" rx="1.8"></rect><rect x="17.5" y="12" width="3.6" height="20" rx="1.8"></rect><rect x="24" y="15" width="3.6" height="14" rx="1.8"></rect><rect x="30.5" y="18.5" width="3.6" height="7" rx="1.8"></rect>
    </sc-if>
    <sc-if value="{{ isMed }}">
      <circle cx="22" cy="12.5" r="4.2"></circle><path d="M17 18.5h10a2 2 0 0 1 2 1.7l1.3 8.3H13.7l1.3-8.3a2 2 0 0 1 2-1.7z"></path><rect x="9.5" y="28" width="25" height="6" rx="3"></rect>
    </sc-if>
    <sc-if value="{{ isLamp }}">
      <path d="M22 8c3 4.6 5.2 7.8 5.2 11a5.2 5.2 0 0 1-10.4 0c0-3.2 2.2-6.4 5.2-11z"></path><path d="M11 25.5h22a11 6.5 0 0 1-22 0z"></path><rect x="20" y="31" width="4" height="3"></rect><rect x="15" y="33.5" width="14" height="3" rx="1.5"></rect>
    </sc-if>
    <sc-if value="{{ isMo }}">
      <circle cx="22" cy="22" r="11.5"></circle><rect x="13.8" y="20.7" width="13.6" height="2.8" rx="1.4" fill="#F7F2E8"></rect>
    </sc-if>
    <sc-if value="{{ isBeads }}">
      <circle cx="16.7" cy="28.3" r="2.7"></circle><circle cx="13.4" cy="23.8" r="2.7"></circle><circle cx="13.4" cy="18.2" r="2.7"></circle><circle cx="16.7" cy="13.7" r="2.7"></circle><circle cx="22" cy="12" r="2.7"></circle><circle cx="27.3" cy="13.7" r="2.7"></circle><circle cx="30.6" cy="18.2" r="2.7"></circle><circle cx="30.6" cy="23.8" r="2.7"></circle><circle cx="27.3" cy="28.3" r="2.7"></circle><circle cx="22" cy="30.8" r="2"></circle><path d="M20.6 32.4h2.8l1.7 5.6h-6.2z"></path>
    </sc-if>
    <sc-if value="{{ isBell }}">
      <circle cx="22" cy="10.5" r="2"></circle><path d="M14 28c0-10 3.2-16 8-16s8 6 8 16z"></path><rect x="11" y="27.5" width="22" height="3.2" rx="1.6"></rect><circle cx="22" cy="33.6" r="2.6"></circle>
    </sc-if>
    <sc-if value="{{ isNotif }}">
      <circle cx="21" cy="11" r="1.9"></circle><path d="M13.5 28c0-9.4 3-15 7.5-15s7.5 5.6 7.5 15z"></path><rect x="10.5" y="27.5" width="21" height="3.2" rx="1.6"></rect><circle cx="21" cy="33.4" r="2.5"></circle><circle cx="30.5" cy="13" r="4.2" fill="#C2857F"></circle>
    </sc-if>
    <sc-if value="{{ isJournal }}">
      <rect x="12.5" y="9.5" width="19" height="25" rx="3"></rect><rect x="16.5" y="17" width="11" height="2.2" rx="1.1" fill="#F7F2E8"></rect><rect x="16.5" y="22.5" width="7.5" height="2.2" rx="1.1" fill="#F7F2E8"></rect>
    </sc-if>
    <sc-if value="{{ isProgress }}">
      <circle cx="22" cy="22" r="10" fill="none" stroke="currentColor" stroke-width="4" opacity=".3"></circle><path d="M22 12a10 10 0 0 1 10 10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"></path>
    </sc-if>
    <sc-if value="{{ isLotus }}">
      <path d="M22 10c4.2 5 4.6 13.4 0 18.6-4.6-5.2-4.2-13.6 0-18.6z"></path><path d="M20.4 28.6c-6-.6-9.6-5.4-9.8-12 5.2.8 8.8 5.2 9.8 12z"></path><path d="M23.6 28.6c6-.6 9.6-5.4 9.8-12-5.2.8-8.8 5.2-9.8 12z"></path><rect x="12.5" y="30" width="19" height="3.6" rx="1.8"></rect>
    </sc-if>
    <sc-if value="{{ isTree }}">
      <circle cx="22" cy="12" r="4.4"></circle><rect x="21" y="15" width="2" height="7"></rect><rect x="13" y="21" width="18" height="2"></rect><rect x="13" y="21" width="2" height="5"></rect><rect x="29" y="21" width="2" height="5"></rect><circle cx="14" cy="30" r="4.4"></circle><circle cx="30" cy="30" r="4.4"></circle>
    </sc-if>
    <sc-if value="{{ isPlus }}">
      <rect x="20" y="11" width="4" height="22" rx="2"></rect><rect x="11" y="20" width="22" height="4" rx="2"></rect>
    </sc-if>
    <sc-if value="{{ isCalendar }}">
      <rect x="10.5" y="12.5" width="23" height="21" rx="4"></rect><rect x="10.5" y="17.5" width="23" height="1.8" fill="#F7F2E8"></rect><rect x="15.5" y="8.5" width="3" height="7" rx="1.5"></rect><rect x="25.5" y="8.5" width="3" height="7" rx="1.5"></rect><circle cx="22" cy="26" r="2.8" fill="#F7F2E8"></circle>
    </sc-if>
    <sc-if value="{{ isGear }}">
      <rect x="14" y="14" width="16" height="16" rx="2.4"></rect><rect x="14" y="14" width="16" height="16" rx="2.4" transform="rotate(45 22 22)"></rect><circle cx="22" cy="22" r="4" fill="#F7F2E8"></circle>
    </sc-if>
    <sc-if value="{{ isTemple }}">
      <circle cx="22" cy="6.8" r="1.7"></circle><rect x="21" y="7.5" width="2" height="5"></rect><path d="M7.5 18.5Q22 8.5 36.5 18.5q-3.6-.4-5.5 1.5H13q-1.9-1.9-5.5-1.5z"></path><path d="M12.5 20h19v12h-6v-5.5a3.5 3.5 0 0 0-7 0V32h-6z"></path><rect x="10" y="32" width="24" height="3" rx="1.2"></rect>
    </sc-if>
    <sc-if value="{{ isArticle }}">
      <path d="M13 9.5h12.5l6 6V32a2.5 2.5 0 0 1-2.5 2.5H13a2.5 2.5 0 0 1-2.5-2.5V12a2.5 2.5 0 0 1 2.5-2.5z"></path><path d="M25.5 9.5v6h6z" fill="#F7F2E8" opacity=".55"></path><rect x="15" y="20" width="12" height="2.2" rx="1.1" fill="#F7F2E8"></rect><rect x="15" y="25.5" width="8" height="2.2" rx="1.1" fill="#F7F2E8"></rect>
    </sc-if>
    <sc-if value="{{ isPhoto }}">
      <rect x="9" y="12" width="26" height="20" rx="4"></rect><circle cx="28" cy="18.5" r="2.6" fill="#F7F2E8"></circle><path d="M12 29.5l7-8 5 5.5 3-3 5 5.5z" fill="#F7F2E8"></path>
    </sc-if>
    <sc-if value="{{ isBuddha }}">
      <circle cx="22" cy="17" r="10" opacity=".28"></circle><circle cx="22" cy="14.5" r="4"></circle><path d="M16.5 21h11a3 3 0 0 1 3 2.6l.8 5.4H12.7l.8-5.4a3 3 0 0 1 3-2.6z"></path><rect x="10" y="29" width="24" height="5" rx="2.5"></rect>
    </sc-if>
    <sc-if value="{{ isEvent }}">
      <path d="M22 8.5c1 7 3.5 9.5 10.5 10.5-7 1-9.5 3.5-10.5 10.5-1-7-3.5-9.5-10.5-10.5 7-1 9.5-3.5 10.5-10.5z"></path><circle cx="32" cy="31" r="2.6"></circle><circle cx="12.5" cy="31.5" r="1.8"></circle>
    </sc-if>
    <sc-if value="{{ isSchedule }}">
      <circle cx="22" cy="22" r="12.5"></circle><rect x="20.8" y="14" width="2.4" height="9.5" rx="1.2" fill="#F7F2E8"></rect><rect x="20.8" y="21.2" width="2.4" height="7.5" rx="1.2" fill="#F7F2E8" transform="rotate(-60 22 22.4)"></rect><circle cx="22" cy="22.4" r="1.9" fill="#F7F2E8"></circle>
    </sc-if>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:64,&quot;height&quot;:64},&quot;icon&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;book&quot;,&quot;talk&quot;,&quot;med&quot;,&quot;lamp&quot;,&quot;mo&quot;,&quot;beads&quot;,&quot;bell&quot;,&quot;notif&quot;,&quot;journal&quot;,&quot;progress&quot;,&quot;lotus&quot;,&quot;tree&quot;,&quot;plus&quot;,&quot;calendar&quot;,&quot;gear&quot;,&quot;temple&quot;,&quot;article&quot;,&quot;photo&quot;,&quot;buddha&quot;,&quot;event&quot;,&quot;schedule&quot;],&quot;default&quot;:&quot;book&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:44,&quot;min&quot;:16,&quot;max&quot;:96,&quot;tsType&quot;:&quot;number&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;gold&quot;,&quot;green&quot;,&quot;rose&quot;,&quot;ink&quot;,&quot;me&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bare&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  static GROUP = { book: 'gold', mo: 'gold', lotus: 'gold', temple: 'gold', tree: 'gold', med: 'green', bell: 'green', progress: 'green', calendar: 'green', beads: 'rose', journal: 'rose', lamp: 'rose', talk: 'ink', notif: 'ink', plus: 'ink', gear: 'ink', article: 'green', photo: 'rose', buddha: 'gold', event: 'rose', schedule: 'green' };
  static TONES = { gold: ['#B8862F', 'rgba(184,134,47,.14)'], green: ['#6E8F7A', 'rgba(110,143,122,.16)'], rose: ['#C2857F', 'rgba(194,133,127,.16)'], ink: ['var(--il-icon-ink,#4A443C)', 'var(--il-icon-ink-bg,rgba(34,30,25,.08))'], me: ['#8A5A18', 'rgba(184,134,47,.12)'] };
  renderVals() {
    const p = this.props, ic = p.icon || 'book', n = Number(p.size) || 44;
    const tone = Component.TONES[p.tone] || Component.TONES[Component.GROUP[ic] || 'gold'];
    const v = { px: n + 'px', rad: Math.round(n * 0.3) + 'px', fg: tone[0], bg: p.bare ? 'transparent' : tone[1] };
    Object.keys(Component.GROUP).forEach(k => { v['is' + k[0].toUpperCase() + k.slice(1)] = ic === k; });
    return v;
  }
}
</script>
</body>
</html>
