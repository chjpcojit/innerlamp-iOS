<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap: {{ gap }}">
  <div style="position:relative;flex:none;box-sizing:border-box;border-radius:50%;width: {{ px }};height: {{ px }};border: {{ ring }};background: {{ glow }}">
    <svg viewBox="0 0 40 56" style="position:absolute;left:50%;transform:translateX(-50%);overflow:visible;width: {{ fw }};height: {{ fh }};bottom: {{ fb }};filter: {{ shadow }}">
      <path d="M23 1C25 11 36 19 36 34c0 12-8 20-16 20S4 47 4 37c0-9 6-14 9-21 2 7 5 10 8 11-2-9-2-17 2-26z" fill="#E6A94E"></path>
      <path d="M21 30c2 5 5 8 5 12a6 6 0 0 1-12 0c0-3 2-5 3-8 1 2 2 3 3 3-1-2-1-4 1-7z" fill="#F3C673"></path>
    </svg>
  </div>
  <sc-if value="{{ word }}">
    <div style="font:600 13px 'Be Vietnam Pro',sans-serif;font-variant-numeric:lining-nums;letter-spacing:.2em;color: {{ ink }}">INNERLAMP</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:110},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:32,&quot;min&quot;:20,&quot;max&quot;:140,&quot;tsType&quot;:&quot;number&quot;},&quot;wordmark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, n = Number(p.size) || 32, fw = n * 0.31;
    return {
      px: n + 'px', gap: Math.round(n * 0.3) + 'px',
      ring: (n * 1.5 / 32).toFixed(2) + 'px solid ' + (p.dark ? '#D9963C' : 'var(--il-logo-ring,#B8862F)'),
      glow: 'radial-gradient(circle at 50% 74%,rgba(217,150,60,.22),transparent 62%)',
      fw: fw.toFixed(2) + 'px', fh: (fw * 56 / 40).toFixed(2) + 'px', fb: (n * 0.22).toFixed(2) + 'px',
      shadow: 'drop-shadow(0 0 ' + (fw * 0.15).toFixed(2) + 'px rgba(217,150,60,.8))',
      word: !!p.wordmark, ink: p.dark ? '#F2EBDD' : 'var(--il-ink,#221E19)',
    };
  }
}
</script>
</body>
</html>
