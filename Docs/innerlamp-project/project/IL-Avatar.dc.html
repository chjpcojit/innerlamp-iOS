<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;width: {{ size }};height: {{ size }};background: {{ bg }};border:1px solid {{ bd }}">
  <div style="font:500 {{ fontSize }} 'Be Vietnam Pro',sans-serif;font-variant-numeric:lining-nums;letter-spacing:.02em;color: {{ fg }}">{{ initials }}</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;initials&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;DT&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;gold&quot;,&quot;green&quot;,&quot;rose&quot;,&quot;ink&quot;],&quot;default&quot;:&quot;gold&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:40,&quot;min&quot;:24,&quot;max&quot;:96,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const tones = {
      gold: { bg: 'rgba(184,134,47,.18)', fg: 'var(--il-link)', bd: 'rgba(184,134,47,.32)' },
      green: { bg: 'rgba(110,143,122,.18)', fg: '#4E6C59', bd: 'rgba(110,143,122,.3)' },
      rose: { bg: 'rgba(194,133,127,.2)', fg: '#9A5F58', bd: 'rgba(194,133,127,.32)' },
      ink: { bg: 'var(--il-ink-08)', fg: 'var(--il-mid)', bd: 'var(--il-ink-12)' },
    };
    const t = tones[p.tone] || tones.gold;
    const size = Number(p.size) || 40;
    return {
      initials: p.initials || 'DT',
      size: size + 'px',
      fontSize: Math.max(10, Math.round(size * 0.34)) + 'px',
      bg: t.bg, fg: t.fg, bd: t.bd,
    };
  }
}

</script>
</body>
</html>
