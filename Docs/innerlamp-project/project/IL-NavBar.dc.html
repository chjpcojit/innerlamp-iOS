<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap&subset=vietnamese,latin" rel="stylesheet">
<style>body{--il-ink:#221E19;--il-ink-10:rgba(34,30,25,.10);--il-ink-48:rgba(34,30,25,.48);--il-card:#FFFDF8;--il-hover:#F3ECDE}</style></helmet>
<div style="display:flex;align-items:center;gap:10px;min-height:38px">
  <div style="width:38px;flex:none;display:flex">
    <sc-if value="{{ showBack }}" hint-placeholder-val="{{ true }}">
      <div onClick="{{ onBack }}" title="Quay lại" style="width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .16s ease;background: {{ btnBg }};border:1px solid {{ btnBd }}" style-hover="background: {{ btnHover }}">
        <div style="width:8px;height:8px;border-left:1.7px solid {{ glyph }};border-bottom:1.7px solid {{ glyph }};transform:translateX(2px) rotate(45deg)"></div>
      </div>
    </sc-if>
  </div>
  <div style="flex:1;min-width:0;text-align:center">
    <div style="font:500 13px 'Be Vietnam Pro',sans-serif;font-variant-numeric:lining-nums;line-height:1.35;color: {{ titleColor }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ title }}</div>
    <sc-if value="{{ hasSub }}">
      <div style="font:400 10.5px 'Be Vietnam Pro',sans-serif;font-variant-numeric:lining-nums;margin-top:2px;color: {{ dim }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ sub }}</div>
    </sc-if>
  </div>
  <div style="min-width:38px;flex:none;display:flex;justify-content:flex-end;align-items:center;gap:8px">
    <sc-if value="{{ hasRight }}">
      <div onClick="{{ onAction }}" style="height:38px;padding:0 14px;border-radius:999px;display:flex;align-items:center;cursor:pointer;font:500 12px 'Be Vietnam Pro',sans-serif;font-variant-numeric:lining-nums;transition:background .16s ease;color: {{ titleColor }};background: {{ btnBg }};border:1px solid {{ btnBd }}" style-hover="background: {{ btnHover }}">{{ right }}</div>
    </sc-if>
    <sc-if value="{{ showClose }}">
      <div onClick="{{ onClose }}" title="Đóng" style="width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .16s ease;background: {{ btnBg }};border:1px solid {{ btnBd }}" style-hover="background: {{ btnHover }}">
        <div style="position:relative;width:12px;height:12px">
          <div style="position:absolute;top:5px;left:0;width:12px;height:1.7px;border-radius:2px;transform:rotate(45deg);background: {{ glyph }}"></div>
          <div style="position:absolute;top:5px;left:0;width:12px;height:1.7px;border-radius:2px;transform:rotate(-45deg);background: {{ glyph }}"></div>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:402,&quot;height&quot;:76},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tiêu đề&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Nội dung&quot;},&quot;right&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Nội dung&quot;},&quot;showBack&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Thành phần&quot;},&quot;showClose&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Thành phần&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Thành phần&quot;},&quot;onBack&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onAction&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const dark = !!p.dark;
    const showBack = p.showBack !== false;
    const showClose = p.showClose === true;
    return {
      title: p.title ?? 'Tiêu đề',
      sub: p.sub ?? '',
      hasSub: !!(p.sub && String(p.sub).trim()),
      showBack, showClose,
      right: p.right ?? '',
      hasRight: !!(p.right && String(p.right).trim()),
      onAction: p.onAction || (() => {}),
      titleColor: dark ? '#F2EBDD' : 'var(--il-ink,#221E19)',
      dim: dark ? 'rgba(242,235,221,.5)' : 'var(--il-ink-48,rgba(34,30,25,.48))',
      glyph: dark ? '#F2EBDD' : 'var(--il-ink,#221E19)',
      btnBg: dark ? 'rgba(242,235,221,.08)' : 'var(--il-card,#FFFDF8)',
      btnBd: dark ? 'rgba(242,235,221,.18)' : 'var(--il-ink-10,rgba(34,30,25,.10))',
      btnHover: dark ? 'rgba(242,235,221,.16)' : 'var(--il-hover,#F3ECDE)',
      onBack: p.onBack || (() => {}),
      onClose: p.onClose || (() => {}),
    };
  }
}
</script>
</body>
</html>
